# Loopback only (docs/06_Streamlit_UI_Specification.md Section 1): this app
# is a single-process, single-run local tool, never intended to be exposed
# on the network.
[server]
address = "127.0.0.1"

[client]
# Hides the Deploy button -- this is a local tool, not something to deploy.
toolbarMode = "viewer"

[theme]
# Main accent color for primary-type buttons (Start Analysis, Confirm
# decision, Execute). Main content area keeps the default light background
# -- only the top bar (via scoped CSS in ui.py) and the sidebar (below) are
# dark navy, per the owner-approved layout change.
primaryColor = "#0D9488"
# .block-container's padding (all four sides) is now pinned entirely by
# CSS in ui_components.AAE_CSS (24px 28px, per the polish-1 design
# tokens) -- these native theme paddings are zeroed so the two mechanisms
# never stack (a non-zero value here would double-count on top of the CSS
# rule).
paddingTop = "0rem"
paddingBottom = "0rem"

[theme.sidebar]
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#1B2A42"
textColor = "#F5F5F5"
paddingTop = "1rem"
