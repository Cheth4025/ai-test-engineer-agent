[project]
name = "ai-test-engineer-agent"
version = "0.1.0"
description = "AI Test Engineer Agent -- Payment Retry & Duplicate Charge Prevention"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "strands-agents>=1.61.0",
    "streamlit==1.66.0",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.114",
    "pytest>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_test_engineer", "decider_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: real Decider-server smoke test, run manually (deselected by default)"]
addopts = "-m \"not live\""
