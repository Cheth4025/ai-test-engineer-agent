[project]
name = "ai-test-engineer-agent"
version = "0.1.0"
description = "AI Test Engineer Agent -- Payment Retry & Duplicate Charge Prevention"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_test_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
